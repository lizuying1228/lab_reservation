[project]
name = "lab-reservation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lzy", email = "lizuying2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "mysqlclient>=2.3.1",
]

[project.scripts]
lab-reservation = "lab_reservation:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "mypy>=2.4.1",
]

